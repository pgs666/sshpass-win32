name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            artifact: windows-x64
          - arch: ARM64
            artifact: windows-arm64

    steps:
      - uses: actions/checkout@v6

      - name: Show CMake version
        run: cmake --version

      - name: Configure
        run: cmake -S . -B "build/${{ matrix.arch }}" -G "Visual Studio 17 2022" -A "${{ matrix.arch }}"

      - name: Build
        run: cmake --build "build/${{ matrix.arch }}" --config Release

      - name: Stage
        shell: pwsh
        run: |
          $out = "dist/${{ matrix.artifact }}"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item "build/${{ matrix.arch }}/Release/sshpass.exe" "$out/sshpass-${{ matrix.artifact }}.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: sshpass-${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}/sshpass-${{ matrix.artifact }}.exe
          if-no-files-found: error

  release:
    runs-on: ubuntu-24.04
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: sshpass-windows-*
          merge-multiple: true

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/sshpass-windows-*.exe

  publish-winget:
    runs-on: ubuntu-24.04
    needs: release
    if: startsWith(github.ref, 'refs/tags/') && github.repository == 'xhcoding/sshpass-win32'
    steps:
      - name: Publish to Winget
        uses: vedantmgoyal9/winget-releaser@main
        with:
          identifier: xhcoding.sshpass-win32
          token: ${{ secrets.WINGET_TOKEN }}

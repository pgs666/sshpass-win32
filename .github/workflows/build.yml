name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            artifact: windows-x64
          - arch: ARM64
            artifact: windows-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Show CMake version
        run: cmake --version

      - name: Configure
        run: cmake -S . -B "build/${{ matrix.arch }}" -G "Visual Studio 17 2022" -A "${{ matrix.arch }}"

      - name: Build
        run: cmake --build "build/${{ matrix.arch }}" --config Release

      - name: Stage
        shell: pwsh
        run: |
          $out = "dist/${{ matrix.artifact }}"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item "build/${{ matrix.arch }}/Release/sshpass.exe" "$out/sshpass-${{ matrix.artifact }}.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sshpass-${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}/sshpass-${{ matrix.artifact }}.exe
          if-no-files-found: error

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/${{ matrix.artifact }}/sshpass-${{ matrix.artifact }}.exe

      - name: Publish to Winget
        uses: vedantmgoyal9/winget-releaser@main
        if: startsWith(github.ref, 'refs/tags/') && matrix.arch == 'x64' && github.repository == 'xhcoding/sshpass-win32'
        with:
          identifier: xhcoding.sshpass-win32
          token: ${{ secrets.WINGET_TOKEN }}
